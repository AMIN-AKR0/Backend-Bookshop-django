{% load static %}
<footer class="footer-section fix footer-bg">
        <div class="container">
            <div class="footer-widget-wrapper">
                <div class="row justify-content-between">
                    <div class="col-xl-4 col-lg-4 col-md-4 wow fadeInUp" data-wow-delay=".2s">
                        <div class="single-footer-widget">
                            <div class="widget-head"><a href="{% url 'home:home' %}" class="footer-logo">
                                    <img src="{% static 'assets/img/logo/white-logo.svg' %}" alt="logo-img">
                                </a>
                            </div>
                            <div class="footer-content">
                                <div class="text">
                                    <a class="mail-text">{{ site_settings.email }}</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-lg-4 col-md-6 wow fadeInUp" data-wow-delay=".8s">
                        <div class="single-footer-widget">
                            <div class="social-icon d-flex align-items-center">
                                {% if site_settings.facebook %}
                                    <a href="{{ site_settings.facebook }}"><i class="fab fa-facebook-f"></i></a>
                                {% endif %}
                                {% if site_settings.x %}
                                    <a href="{{ site_settings.x }}"><i class="fab fa-x"></i></a>
                                {% endif %}
                                {% if site_settings.instagram %}
                                    <a href="{{ site_settings.instagram }}"><i class="fab fa-instagram"></i></a>
                                {% endif %}
                                {% if site_settings.linkedin %}
                                    <a href="{{ site_settings.linkedin }}"><i class="fab fa-linkedin"></i></a>
                                {% endif %}
                                {% if site_settings.telegram %}
                                    <a href="{{ site_settings.telegram }}"><i class="fab fa-telegram"></i></a>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>
